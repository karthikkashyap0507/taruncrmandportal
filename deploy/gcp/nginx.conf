# JobsNexGen on one server: job portal on www.jobsnexgen.com, CRM on crm.jobsnexgen.com.
# Installed by deploy/gcp/setup.sh; deploy/gcp/enable-https.sh adds HTTPS via certbot.

# Bare domain -> www
server {
    listen 80;
    server_name jobsnexgen.com;
    return 301 $scheme://www.jobsnexgen.com$request_uri;
}

# Job portal: Next.js on 3001, FastAPI on 8000
server {
    listen 80;
    server_name www.jobsnexgen.com;
    client_max_body_size 20m;

    location /api/    { proxy_pass http://127.0.0.1:8000; include proxy_params; }
    location /static/ { proxy_pass http://127.0.0.1:8000; include proxy_params; }
    location /        { proxy_pass http://127.0.0.1:3001; include proxy_params; }
}

# CRM: Next.js on 3002, FastAPI on 8001
server {
    listen 80;
    server_name crm.jobsnexgen.com;
    client_max_body_size 20m;

    location /api/     { proxy_pass http://127.0.0.1:8001; include proxy_params; }
    location /uploads/ { proxy_pass http://127.0.0.1:8001; include proxy_params; }
    location /         { proxy_pass http://127.0.0.1:3002; include proxy_params; }
}
