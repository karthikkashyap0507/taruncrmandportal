services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobsnexgen
      POSTGRES_PASSWORD: jobsnexgen
      POSTGRES_DB: jobsnexgen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://jobsnexgen:jobsnexgen@postgres:5432/jobsnexgen
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      SECRET_KEY: dev-secret-change-in-production
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
